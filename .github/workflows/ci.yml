# Every push to main and every pull request is built, tested and bundled on a Mac,
# so a change that breaks the core, the app target or the copy rules never lands.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless, so it is cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # The app uses macOS 26 APIs behind availability checks, so it needs the macOS 26 SDK from Xcode 26.
    runs-on: macos-26
    timeout-minutes: 45
    # The Mac app is one platform of memnox-desktop, so its steps run inside macos/.
    defaults:
      run:
        working-directory: macos
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The one Noise build lives in the runtime, so the Mac, the phone and the runtime run the same crate.
      - name: Check out memnox-runtime
        uses: actions/checkout@v7
        with:
          repository: Memnox/memnox-runtime
          path: memnox-runtime

      # The tests read shared/vectors, so a copy that fell behind the runtime fails here rather than passing on old bytes.
      - name: The protocol vectors match the runtime
        run: cmp ../shared/vectors/protocol.json ../memnox-runtime/vectors/protocol.json

      - name: Select the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache the build
        uses: actions/cache@v6
        with:
          path: macos/.build
          key: spm-${{ runner.os }}-${{ hashFiles('macos/Package.swift', 'macos/Sources/**/*.swift', 'macos/Tests/**/*.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Cache the Noise build
        uses: actions/cache@v6
        with:
          path: memnox-runtime/native/noise/target
          key: noise-${{ runner.os }}-${{ hashFiles('memnox-runtime/native/noise/Cargo.lock', 'memnox-runtime/native/noise/src/**') }}
          restore-keys: noise-${{ runner.os }}-

      - name: Vendor the Noise framework
        env:
          MEMNOX_RUNTIME: ${{ github.workspace }}/memnox-runtime
        run: ./scripts/vendor-noise.sh

      - name: Build the core, the app and the tests
        run: swift build --build-tests

      - name: Run the tests
        run: swift test --skip-build

      - name: Build the app bundle
        # Signed ad hoc here, since the runner has no local signing identity; that is enough to prove it bundles.
        # The npm source writes the runtime's origin into the bundle without building a runtime checkout.
        env:
          MEMNOX_RUNTIME_SOURCE: npm
        run: ./scripts/bundle.sh

  tauri:
    name: Windows and Linux app on ${{ matrix.os }}
    # The one Tauri app both run, built and tested on each, since neither can be built from a Mac.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: shared/tauri-core
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The app imports the wire from the runtime's own build, so it is built from the runtime's main.
      - name: Check out memnox-runtime
        uses: actions/checkout@v7
        with:
          repository: Memnox/memnox-runtime
          path: memnox-runtime

      - name: Install the Linux libraries Tauri, the layer shell and the microphone build against
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libgtk-layer-shell-dev libasound2-dev

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The cache keeps a build script output that names target/sherpa-onnx-prebuilt but deletes that folder, so the libraries live outside target.
      - name: Fetch the sherpa-onnx libraries
        run: sh scripts/sherpa-libs.sh

      - name: Copy the wire from the runtime
        env:
          MEMNOX_RUNTIME: ${{ github.workspace }}/memnox-runtime
        run: pnpm wire

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test and build the webview
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Lint and test the Rust
        working-directory: .
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      # Debug and unbundled, which is enough to prove the app links on this system; releases sign their own builds.
      - name: Build the app
        run: pnpm tauri build --debug --no-bundle

  copy:
    name: Copy rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: No dash stands in copy or comments
        # The characters are written as escapes so this file never contains the dashes it forbids.
        run: |
          if grep -rnIP '\x{2014}|\x{2013}' macos/Sources macos/Tests macos/scripts macos/docs macos/README.md macos/CLAUDE.md macos/CONTRIBUTING.md linux windows shared README.md CLAUDE.md SECURITY.md CODE_OF_CONDUCT.md; then
            echo "::error::An em or en dash stands in the lines above. Write the word it stood for (because, so, which) or two sentences."
            exit 1
          fi
