# Every push to main and every pull request is built, tested and bundled on a Mac,
# so a change that breaks the core, the app target or the copy rules never lands.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless, so it is cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # The app uses macOS 26 APIs behind availability checks, so it needs the macOS 26 SDK from Xcode 26.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build the core, the app and the tests
        run: swift build --build-tests

      - name: Run the tests
        run: swift test --skip-build

      - name: Build the app bundle
        # Signed ad hoc here, since the runner has no local signing identity; that is enough to prove it bundles.
        run: ./scripts/bundle.sh

  copy:
    name: Copy rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: No dash stands in copy or comments
        # The characters are written as escapes so this file never contains the dashes it forbids.
        run: |
          if grep -rnP '\x{2014}|\x{2013}' Sources Tests scripts docs README.md CLAUDE.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md; then
            echo "::error::An em or en dash stands in the lines above. Write the word it stood for (because, so, which) or two sentences."
            exit 1
          fi
