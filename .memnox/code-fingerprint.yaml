stack:
  - Swift 6 toolchain, swift-tools-version 5.10, Swift Package Manager, macOS 14 or later
  - "Apple frameworks only: Foundation, CryptoKit, LocalAuthentication, Security, AppKit, SwiftUI, Metal, AVFoundation, Speech"
  - no third party packages; Package.swift has no dependencies
layout:
  - memnox-desktop holds every desktop app; the Mac app is in macos/, and every path below that names no folder is inside it
  - linux/ and windows/ are the layers of one Tauri app whose core is in shared/
  - "macos/Sources/MemnoxVoiceCore: Domain (pure rules), Application (Conversation and Ports), Infrastructure (adapters); no UI imports"
  - "Domain/SharedKernel/DaemonProtocol.swift is the wire model shared with memnox-runtime's protocol.ts"
  - "macos/Sources/MemnoxVoice: App (composition root), Presentation (island, cards, menu bar, design system), Platform (audio, typing, hotkey)"
  - "Tests/MemnoxVoiceCoreTests mirrors the source tree; doubles in Support/TestDoubles.swift, JSON helpers in Support/Fixtures.swift"
  - .build, build and *.app are generated by swift build and scripts/bundle.sh; never edit them
architecture:
  - this app is a face, a voice and a Touch ID button over the daemon; no policy, no rule and no model call live here
  - "dependency rule: Domain uses only Foundation; Application uses Domain and its Ports; Infrastructure implements Ports"
  - App/AppDelegate.swift is the only place adapters are built and handed to the core
  - everything reaches the daemon through the DaemonLink port, implemented by UnixSocketLink over ~/.memnox/memnox.sock
  - what the person said goes whole to the daemon's ask; never match keywords on it
  - every allow is signed over confirmationMessage in DaemonProtocol.swift; denies and declines go unsigned
  - the clock, OS version and disk reads reach the core as init closures (now, macOSMajorVersion, address)
  - "example: Sources/MemnoxVoiceCore/Application/Conversation.swift"
recipe:
  - add the field or method to Domain/SharedKernel/DaemonProtocol.swift and the runtime's protocol.ts together
  - put a rule about what to say or when in Domain as a pure function or type, with a test at the mirrored path
  - drive it from Application/Conversation.swift; if it needs the Mac, add a protocol in Application/Ports
  - implement the port in Infrastructure (core) or Platform (app), and wire it in App/AppDelegate.swift
  - show it in Presentation using the tokens in Presentation/DesignSystem.swift
naming:
  - files are UpperCamelCase named for the main type or role (Conversation.swift, Echo.swift)
  - types are plain nouns from speech, not jargon (Speaker, Face, Presenter, Diary)
  - "tests: one XCTestCase per source file, named <File>Tests; methods testSaysWhatItDoes"
  - constants named for their role (rowSpacing, idleCloseDelay), never for their value
style:
  - final class for stateful objects, struct and String raw value enums for data; private by default
  - a switch over the app's own enums lists every case with no default
  - no magic numbers or identifier strings; view metrics are private static lets, shared ones Memnox tokens
  - daemon values are read through core enums (NoticeKind, SessionState, StepSurface), never compared as strings
  - user facing copy stays inline in Text(...) so it is a localization key
  - anything touching AppKit is @MainActor; the core uses async/await and AsyncThrowingStream
  - no Any values; Apple's untyped APIs are converted in one private function per file
  - force unwraps only where the system guarantees the value, with the reason in a comment beside it
errors:
  - daemon and socket failures throw ProtocolError (unreadable, refused, disconnected)
  - callers that can carry on use try? and fall back to a sensible empty value
  - a failure the person should hear becomes a plain spoken sentence, never a raw error
data:
  - absence is an optional, never a sentinel; empty strings are treated as nil
  - durations are TimeInterval constants with a comment saying why that value
logging:
  - "the core notes steps with diary.note(...), which also writes os Logger subsystem com.memnox.voice"
  - "the app target uses NSLog prefixed 'Memnox:' only for startup failures"
configuration:
  - preferences live in UserDefaults under static key constants; there are no secrets in the app
  - the confirmation key lives in the Secure Enclave and the login keychain, never in code or on disk
dependencies:
  - do not add packages; use Apple frameworks
testing:
  - XCTest with XCTAssert and @testable import MemnoxVoiceCore
  - "only the ports are faked (ScriptedLink, RecordingSpeaker, RecordingFace, PersonKey, MemoryOwner); no socket or audio"
  - "example: Tests/MemnoxVoiceCoreTests/Domain/Speech/EchoTests.swift"
commands:
  - swift test must pass at every commit
  - ./scripts/bundle.sh builds and signs build/Memnox.app
comments:
  - /// doc comments on types and members, one or two lines saying why; delete comments that restate code
  - "no dash in any comment or copy: write the linking word (because, so, which) instead"
enforce:
  - name: core-has-no-ui
    files: ["macos/Sources/MemnoxVoiceCore/**"]
    forbid: ["*import AppKit*", "*import SwiftUI*", "*import Cocoa*", "*import Metal*", "*import AVFoundation*", "*import Speech*"]
    reason: the core is AppKit free so it is tested headless
    instead: put UI, audio and recognizer code in Sources/MemnoxVoice behind a port in Application/Ports
  - name: domain-has-no-io
    files: ["macos/Sources/MemnoxVoiceCore/Domain/**"]
    forbid: ["*FileManager*", "*UserDefaults*", "*NSHomeDirectory(*", "*NSFullUserName(*", "*ProcessInfo*", "*Bundle.main*"]
    reason: the domain is pure rules, so every outside read arrives through a parameter
    instead: take the value as a parameter and read it in Infrastructure or the composition root
  - name: application-knows-only-ports
    files: ["macos/Sources/MemnoxVoiceCore/Application/**", "macos/Sources/MemnoxVoiceCore/Domain/**"]
    forbid: ["*UnixSocketLink*", "*SecureEnclaveConfirmKey*", "*SoftwareConfirmKey*", "*DefaultsOwner*", "*chosenAddress(*"]
    reason: use cases depend on ports and the composition root picks the adapters
    instead: take the port or a closure in init and wire the adapter in App/AppDelegate.swift
  - name: no-keyword-matching-in-conversation
    files: ["macos/Sources/MemnoxVoiceCore/Application/Conversation.swift"]
    forbid: ["*.lowercased()*", "*.contains(\"*", "*localizedCaseInsensitiveContains(*", "*NLTagger*"]
    reason: what the person said goes whole to ask and nothing acts on a word
    instead: send the words to the daemon's ask and let the person's agent understand them
  - name: no-model-or-network-calls
    files: ["macos/Sources/**", "!macos/Sources/MemnoxVoice/Platform/Kokoro.swift"]
    forbid: ["*URLSession*", "*api.anthropic.com*", "*Process()*", "*NSTask*"]
    reason: the daemon decides and the person's own agent CLI thinks, so this app makes no model call
    instead: add a daemon method and reach it through DaemonLink
  - name: one-confirmation-message
    files: ["macos/Sources/**", "!macos/Sources/MemnoxVoiceCore/Domain/SharedKernel/DaemonProtocol.swift"]
    forbid: ["*memnox-confirm:*"]
    reason: the signed string must stay byte for byte what the runtime builds, so it is built in one place
    instead: call confirmationMessage(subject:answer:)
  - name: protocol-values-are-enums
    files: ["macos/Sources/**"]
    forbid: ["*notice == \"*", "*state == \"*", "*surface == \"*"]
    reason: daemon values are compared as enums, so a typo is a compile error
    instead: use noticeKind, sessionState or stepSurface and compare against the enum case
  - name: no-print
    files: ["macos/Sources/**"]
    forbid: ["*print(*", "*dump(*"]
    reason: steps are noted in the diary, which logs through os Logger
    instead: diary.note with a plain sentence
  - name: core-logs-to-diary
    files: ["macos/Sources/MemnoxVoiceCore/**"]
    forbid: ["*NSLog(*"]
    reason: the core notes what happened in the diary so Copy What Happened can hand it over
    instead: diary.note with a plain sentence
  - name: core-injected-clock
    files: ["macos/Sources/MemnoxVoiceCore/**", "!macos/Sources/MemnoxVoiceCore/Infrastructure/Logging/Diary.swift"]
    forbid: ["*Date()*"]
    reason: core logic takes its clock as an injected closure so tests control time
    instead: "take now as a () -> Date closure defaulting to Date.init in init, and call now()"
  - name: core-uses-async
    files: ["macos/Sources/MemnoxVoiceCore/**"]
    forbid: ["*DispatchQueue*", "*import Combine*"]
    reason: the core is written with async/await and AsyncThrowingStream
    instead: use an async function, a Task or an AsyncThrowingStream
  - name: no-crash-shortcuts
    files: ["macos/Sources/**"]
    forbid: ["*try!*", "*fatalError(*", "*as! *"]
    reason: failures fall back or throw ProtocolError, so the app never crashes on purpose
    instead: throw, or use try? or as? with a fallback and a diary note
  - name: no-untyped-values
    files: ["macos/Sources/**", "!macos/Sources/MemnoxVoice/Presentation/Flight.swift", "!macos/Sources/MemnoxVoiceCore/Infrastructure/Security/SecureEnclaveConfirmKey.swift"]
    forbid: ["*[String: Any]*", "*JSONSerialization*"]
    reason: data is typed, and the two untyped Apple APIs are confined to one function each
    instead: decode with a private Decodable struct
  - name: xctest-only
    files: ["macos/Tests/**"]
    forbid: ["*import Testing*", "*#expect(*", "*#require(*", "*import Quick*", "*import Nimble*"]
    reason: tests are XCTest with XCTAssert
    instead: a final class XCTestCase with func testSaysWhatItDoes and XCTAssertEqual
  - name: no-dash-in-copy
    files: ["macos/Sources/**", "macos/Tests/**", "macos/README.md", "macos/CLAUDE.md", "macos/CONTRIBUTING.md", "macos/docs/**", "macos/scripts/**", "linux/**", "windows/**", "shared/**", "README.md", "CLAUDE.md", "SECURITY.md"]
    forbid: ["*—*", "*–*"]
    reason: no em or en dash stands in any copy or comment
    instead: write the linking word the dash stood for (because, so, which, and) or split into two sentences
