[package]
name = "memnox-desktop-noise"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "memnox-runtime's Noise layer over snow, copied by scripts/sync-noise.sh, so this app, the Mac, the phone and the runtime run one Noise."
publish = false

[dependencies]
snow = "0.10"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
