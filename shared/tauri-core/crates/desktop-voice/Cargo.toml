[package]
name = "memnox-desktop-voice"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The voice of Memnox on Windows and Linux: Parakeet hears, Kokoro speaks, both through sherpa-onnx on this computer."
publish = false

[dependencies]
sherpa-onnx = "1.13.8"
cpal = "0.15"
rodio = { version = "0.20", default-features = false }
ureq = "2"
bzip2 = "0.6"
tar = "0.4"
# WebRTC's echo canceller, AEC3, ported to Rust, so the microphone hears the person and not the voice.
sonora = "0.2"

[target.'cfg(windows)'.dependencies]
# The computer's own voice until Kokoro is in: OneCore through WinRT, rendered to a stream.
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Core",
  "Media_SpeechSynthesis",
  "Storage_Streams",
  "Win32_System_Com",
] }
