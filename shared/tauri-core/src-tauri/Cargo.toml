[package]
name = "memnox-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Memnox on Windows and Linux: the island, the daemon link and the confirm key."
publish = false

[lib]
name = "memnox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-global-shortcut = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
sha2 = "0.10"
# Fetches the official Node for a computer with none new enough, as setup needs it.
ureq = "2"
memnox-desktop-key = { path = "../crates/desktop-key" }
memnox-desktop-voice = { path = "../crates/desktop-voice" }
# The relay to a paired server: the runtime's own Noise over snow, a WebSocket over rustls, and the
# paired servers and the person's credential in Credential Manager or the Secret Service.
memnox-desktop-noise = { path = "../crates/desktop-noise" }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
base64 = "0.22"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
memnox-windows = { path = "../../../windows/native" }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
memnox-linux = { path = "../../../linux/native" }
x11-dl = "2.21"
